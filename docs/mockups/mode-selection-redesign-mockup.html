<!doctype html>
<html lang="es" class="mode-selection-mockup-root">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup — selección de modo</title>
  <link rel="stylesheet" href="../../styles.css?v=2.6.52-mode-mock-final">
</head>
<body class="mode-selection-mockup">
  <main class="mode-mock-shell" aria-labelledby="mode-mock-title">
    <div class="mode-mock-space" aria-hidden="true"></div>

    <header class="mode-mock-header" aria-label="Perfil y recursos">
      <button class="mode-mock-profile" type="button" aria-label="Abrir perfil">
        <span class="mode-mock-avatar">
          <span class="mode-mock-avatar-crop"><img src="../../img/ui-generated/home/avatar-robot.png" alt=""></span>
          <span class="mode-mock-level-badge">1</span>
        </span>
        <span class="mode-mock-identity"><b>Jugador</b><span>Nivel 1</span></span>
      </button>

      <div class="mode-mock-wallet">
        <button class="mode-mock-pill mode-mock-coins" type="button" aria-label="1000 monedas">
          <span class="mode-mock-coin" aria-hidden="true">★</span><b>1000</b><span class="mode-mock-plus" aria-hidden="true">+</span>
        </button>
        <button class="mode-mock-pill mode-mock-gems" type="button" aria-label="30 gemas">
          <img src="../../img/ui-v2/home/gem.png" alt=""><b>30</b><span class="mode-mock-plus" aria-hidden="true">+</span>
        </button>
        <span class="mode-mock-pill mode-mock-fire" aria-label="Racha: 0">
          <img src="../../img/ui-v2/home/fire.png" alt=""><b>0</b>
        </span>
        <button class="mode-mock-settings" type="button" aria-label="Ajustes">
          <img src="../../img/ui-generated/home/nav-settings.png" alt="">
        </button>
      </div>
    </header>

    <section class="mode-mock-main" aria-label="Catálogo de modos">
      <button class="mode-mock-back" type="button" aria-label="Volver">
        <img src="../../img/icons-v2/8-ui/arrow-left-02.svg" alt="">
      </button>

      <div class="mode-mock-heading">
        <span class="mode-mock-spark mode-mock-spark-left" aria-hidden="true"></span>
        <h1 id="mode-mock-title">Elige tu modo</h1>
        <span class="mode-mock-spark mode-mock-spark-right" aria-hidden="true"></span>
        <p>Cada modo, una forma diferente de jugar</p>
      </div>

      <div class="mode-mock-catalog">
        <button class="mode-mock-card mode-mock-card-survival" type="button">
          <span class="mode-mock-art"><img src="../../img/ui-generated/modes/mode-survival.png" alt=""></span>
          <span class="mode-mock-copy">
            <span class="mode-mock-title-row"><b class="mode-mock-card-title">Supervivencia</b><span class="mode-mock-tag">OLEADAS INFINITAS</span></span>
            <span class="mode-mock-description">Enfréntate a oleadas crecientes<br> de enemigos. Cada vez son más<br> fuertes. ¿Cuánto tiempo podrás<br> sobrevivir?</span>
          </span>
          <span class="mode-mock-go" aria-hidden="true"><img src="../../img/icons-v2/8-ui/arrow-right-03.svg" alt=""></span>
        </button>

        <button class="mode-mock-card mode-mock-card-classic mode-mock-card-tall" type="button">
          <span class="mode-mock-art"><img src="../../img/ui-generated/modes/mode-classic.png" alt=""></span>
          <span class="mode-mock-copy">
            <span class="mode-mock-title-row"><b class="mode-mock-card-title">Clásico</b><span class="mode-mock-tag">POR NIVELES</span></span>
            <span class="mode-mock-description">Supera niveles con diferentes mapas<br> y desafíos únicos. Nuevos obstáculos,<br> mecánicas y objetos te esperan<br> en cada uno.</span>
          </span>
          <span class="mode-mock-go" aria-hidden="true"><img src="../../img/icons-v2/8-ui/arrow-right-03.svg" alt=""></span>
          <span class="mode-mock-features mode-mock-features-four">
            <span><img src="../../img/ui/lock.png" alt=""><small>Bloqueos</small></span>
            <span><img src="../../img/ui-v2/home/target.png" alt=""><small>Objetos</small></span>
            <span><img src="../../img/ui-v2/home/bolt.png" alt=""><small>Eventos</small></span>
            <span class="mode-mock-more"><small>¡Y mucho más!</small></span>
          </span>
        </button>

        <button class="mode-mock-card mode-mock-card-multi mode-mock-card-tall" type="button" disabled aria-disabled="true" aria-label="Multijugador, próximamente">
          <span class="mode-mock-art"><img src="../../img/ui-generated/modes/mode-multiplayer.png" alt=""></span>
          <span class="mode-mock-copy">
            <span class="mode-mock-title-row"><b class="mode-mock-card-title">Multijugador</b><span class="mode-mock-tag">COMPITE EN LÍNEA</span></span>
            <span class="mode-mock-description">Compite contra otro jugador en el mismo<br> tablero. Cada uno por su lado.<br> Gana quien termine primero y consiga<br> la mejor puntuación.</span>
          </span>
          <span class="mode-mock-go" aria-hidden="true"><img src="../../img/icons-v2/8-ui/arrow-right-03.svg" alt=""></span>
          <span class="mode-mock-features mode-mock-features-three">
            <span><img src="../../img/ui-v2/home/trophy.png" alt=""><small>Termina primero<br>el tablero</small></span>
            <span><img src="../../img/ui-v2/home/medal.png" alt=""><small>Mejor<br>puntuación</small></span>
            <span><img src="../../img/icons-v2/9-media/wi-fi.svg" alt=""><small>Partidas<br>en línea</small></span>
          </span>
        </button>

        <button class="mode-mock-help" type="button">
          <span class="mode-mock-help-art"><img src="../../img/ui-generated/home/nav-guide.png" alt=""></span>
          <span class="mode-mock-help-copy"><b>¿Cómo se juega?</b><span>Repasa las reglas, consejos y todo lo que<br> necesitas saber para dominar el juego.</span></span>
          <span class="mode-mock-help-cta">Ver información<img src="../../img/icons-v2/8-ui/arrow-right-03.svg" alt=""></span>
        </button>

        <div class="mode-mock-extra-heading" role="presentation"><span>Más modos</span></div>

        <button class="mode-mock-card mode-mock-card-adventure mode-mock-card-extra" type="button">
          <span class="mode-mock-art"><img src="../../img/ui-generated/home/hero-rocket.png" alt=""></span>
          <span class="mode-mock-copy">
            <span class="mode-mock-title-row"><b class="mode-mock-card-title">Aventura</b><span class="mode-mock-tag">INFINITO</span></span>
            <span class="mode-mock-description">Viaje infinito por biomas con reglas<br> propias, objetivos y mini-jefes.<br> ¿Hasta dónde llegarás?</span>
          </span>
          <span class="mode-mock-go" aria-hidden="true"><img src="../../img/icons-v2/8-ui/arrow-right-03.svg" alt=""></span>
          <span class="mode-mock-features mode-mock-features-three">
            <span><img src="../../img/ui/planet.png" alt=""><small>Biomas</small></span>
            <span><img src="../../img/ui-v2/home/target.png" alt=""><small>Objetivos</small></span>
            <span><img src="../../img/ui/skull.png" alt=""><small>Mini-jefes</small></span>
          </span>
        </button>

        <button class="mode-mock-card mode-mock-card-timed mode-mock-card-extra" type="button">
          <span class="mode-mock-art"><img src="../../img/ui-generated/modes/mode-timed.png" alt=""></span>
          <span class="mode-mock-copy">
            <span class="mode-mock-title-row"><b class="mode-mock-card-title">Contrarreloj</b><span class="mode-mock-tag">CONTRARRELOJ</span></span>
            <span class="mode-mock-description">Cada convergencia suma tiempo, pero<br> la presión crece. Puntúa todo lo posible<br> antes de llegar a cero.</span>
          </span>
          <span class="mode-mock-go" aria-hidden="true"><img src="../../img/icons-v2/8-ui/arrow-right-03.svg" alt=""></span>
          <span class="mode-mock-features mode-mock-features-three">
            <span><img src="../../img/ui-v2/home/clock.png" alt=""><small>Gana tiempo</small></span>
            <span><img src="../../img/ui-v2/home/bolt.png" alt=""><small>Presión creciente</small></span>
            <span><img src="../../img/ui-v2/home/trophy.png" alt=""><small>Mejor puntuación</small></span>
          </span>
        </button>

        <button class="mode-mock-card mode-mock-card-zen mode-mock-card-extra" type="button">
          <span class="mode-mock-art"><img src="../../img/ui-generated/modes/mode-zen.png" alt=""></span>
          <span class="mode-mock-copy">
            <span class="mode-mock-title-row"><b class="mode-mock-card-title">Zen</b><span class="mode-mock-tag">RELAX</span></span>
            <span class="mode-mock-description">Ritmo relajado, sin penalizaciones<br> ni fin de partida. Juega y respira.</span>
          </span>
          <span class="mode-mock-go" aria-hidden="true"><img src="../../img/icons-v2/8-ui/arrow-right-03.svg" alt=""></span>
          <span class="mode-mock-features mode-mock-features-three">
            <span><img src="../../img/ui/leaf.png" alt=""><small>Sin penalizaciones</small></span>
            <span><img src="../../img/icons-v2/8-ui/rest.svg" alt=""><small>Sin límite</small></span>
            <span><img src="../../img/ui/heart.png" alt=""><small>Ritmo relajado</small></span>
          </span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
