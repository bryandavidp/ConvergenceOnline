<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mockup HUD Supervivencia</title>
  <style>
    :root {
      --bg: #071027;
      --panel: rgba(15, 25, 58, .86);
      --panel-2: rgba(24, 38, 82, .78);
      --line: rgba(145, 172, 255, .24);
      --line-strong: rgba(152, 198, 255, .44);
      --text: #f7f9ff;
      --muted: #9fb1d7;
      --cyan: #19e6e6;
      --gold: #ffd84d;
      --green: #43e58f;
      --red: #ff5b74;
      --pink: #ff5fb2;
      --violet: #a879ff;
      --orange: #ff9b3d;
      font-family: Inter, ui-rounded, "Arial Rounded MT Bold", system-ui, -apple-system, Segoe UI, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start;
      background: #030816;
      color: var(--text);
    }

    .phone {
      position: relative;
      width: min(430px, 100vw);
      min-height: 932px;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 4%, rgba(25, 230, 230, .15), transparent 32%),
        radial-gradient(circle at 17% 80%, rgba(94, 124, 255, .10), transparent 30%),
        linear-gradient(180deg, #102d4a 0%, #0b1634 42%, #070b22 100%);
      border: 1px solid rgba(255, 216, 77, .38);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .65);
    }

    .stars, .stars::before, .stars::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 11%, rgba(255,255,255,.36) 0 1px, transparent 2px),
        radial-gradient(circle at 64% 7%, rgba(255,255,255,.25) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 11%, rgba(255,255,255,.26) 0 1px, transparent 2px),
        radial-gradient(circle at 31% 29%, rgba(255,255,255,.30) 0 1px, transparent 2px),
        radial-gradient(circle at 53% 86%, rgba(255,255,255,.28) 0 1px, transparent 2px),
        radial-gradient(circle at 31% 96%, rgba(255,255,255,.34) 0 1px, transparent 2px);
      opacity: .72;
    }

    .game {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 932px;
      display: grid;
      grid-template-rows: auto auto auto auto auto auto 1fr;
      row-gap: 8px;
      padding: 18px 0 12px;
    }

    .topbar {
      width: calc(100% - 20px);
      justify-self: center;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 44px;
      align-items: center;
      column-gap: 8px;
      min-height: 38px;
      position: relative;
    }

    .coin-stack {
      width: min(100%, 336px);
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      min-height: 26px;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(35, 52, 106, .74), rgba(12, 20, 49, .82));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 7px 18px rgba(0,0,0,.25);
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      line-height: 1;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    button.pill {
      appearance: none;
      font: inherit;
      cursor: pointer;
    }

    .wallet-pill {
      min-width: 0;
      flex: 1 1 0;
      justify-content: space-between;
      padding-right: 6px;
    }

    .plus {
      position: relative;
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255,216,77,.62);
      background: rgba(255,216,77,.10);
      color: var(--gold);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
      flex: 0 0 auto;
    }

    .plus::before,
    .plus::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 1.5px;
      border-radius: 999px;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .plus::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .pill img { width: 14px; height: 14px; object-fit: contain; }
    .pill strong { color: var(--gold); font-weight: 950; }
    .pill.gems { border-color: rgba(180,108,255,.38); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 14px rgba(168,121,255,.12); }
    .pill.gems strong { color: #c8a7ff; }
    .pill.gems .plus { border-color: rgba(200,167,255,.62); background: rgba(168,121,255,.12); color: #d8c2ff; }
    .pill.run { min-height: 26px; padding: 4px 8px; color: rgba(255,255,255,.76); border-color: rgba(255,216,77,.28); }
    .pill.run strong { color: var(--green); }

    .score-row {
      width: calc(100% - 20px);
      justify-self: center;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) 64px;
      align-items: center;
      column-gap: 6px;
      min-height: 66px;
    }

    .scorebox {
      width: auto;
      justify-self: center;
      text-align: center;
      min-width: 0;
      padding: 2px 0 0;
    }

    .score {
      display: block;
      color: var(--cyan);
      font-size: 34px;
      font-weight: 1000;
      line-height: .95;
      letter-spacing: 0;
      text-shadow: 0 0 18px rgba(25, 230, 230, .58);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .score-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 11px;
      font-weight: 900;
      color: rgba(255,255,255,.56);
      text-transform: uppercase;
    }

    .best-score {
      color: rgba(255,255,255,.72);
      font-variant-numeric: tabular-nums;
    }

    .best-score strong {
      color: var(--gold);
      font-weight: 1000;
    }

    .mult {
      color: var(--gold);
      font-size: 14px;
      text-transform: none;
      text-shadow: 0 0 12px rgba(255,216,77,.55);
    }

    .controls {
      justify-self: end;
      display: flex;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(175, 210, 255, .26);
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(54, 86, 130, .60), rgba(23, 38, 76, .70));
      color: #f7fbff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 7px 15px rgba(0,0,0,.25);
      font-size: 19px;
      font-weight: 950;
      line-height: 1;
    }

    .pause-mark {
      position: relative;
      width: 15px;
      height: 18px;
      display: block;
    }

    .pause-mark::before,
    .pause-mark::after {
      content: "";
      position: absolute;
      top: 1px;
      width: 4px;
      height: 16px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 8px rgba(255,255,255,.22);
    }

    .pause-mark::before { left: 2px; }
    .pause-mark::after { right: 2px; }

    .event-dock {
      width: calc(100% - 20px);
      justify-self: center;
      height: 74px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 6px;
      padding: 2px 0;
    }

    .event {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      max-width: min(340px, 92vw);
      min-height: 38px;
      padding: 7px 14px;
      border-radius: 15px;
      background: linear-gradient(180deg, rgba(15, 92, 74, .88), rgba(12, 60, 69, .86));
      border: 1px solid rgba(62, 237, 179, .68);
      box-shadow: 0 11px 22px rgba(0,0,0,.32), 0 0 20px rgba(62, 237, 179, .28), inset 0 1px 0 rgba(255,255,255,.12);
      font-size: 15px;
      font-weight: 950;
      line-height: 1.1;
      white-space: nowrap;
    }

    .event.secondary {
      min-height: 28px;
      padding: 5px 11px;
      border-radius: 13px;
      background: linear-gradient(180deg, rgba(94, 30, 68, .86), rgba(56, 20, 50, .86));
      border-color: rgba(255, 94, 152, .58);
      box-shadow: 0 8px 18px rgba(0,0,0,.24), 0 0 14px rgba(255, 94, 152, .22);
      font-size: 12px;
      color: rgba(255,255,255,.92);
    }

    .event .ic {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: rgba(255,255,255,.14);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    }

    .event .count {
      margin-left: 2px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--pink);
      color: #fff;
      font-size: 11px;
      line-height: 1;
    }

    .surv-panel {
      width: calc(100% - 20px);
      justify-self: center;
      border: 1px solid rgba(255,216,77,.48);
      border-radius: 13px;
      background: linear-gradient(180deg, rgba(10, 18, 44, .76), rgba(8, 14, 35, .82));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 9px 24px rgba(0,0,0,.28);
      padding: 8px 10px;
    }

    .surv-grid {
      display: grid;
      grid-template-columns: 74px 1fr 62px;
      align-items: center;
      column-gap: 8px;
    }

    .metric {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }

    .metric .k {
      color: rgba(255,255,255,.52);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
    }

    .metric .v {
      color: var(--text);
      font-size: 16px;
      font-weight: 1000;
      line-height: 1;
      white-space: nowrap;
    }

    .lives .v { letter-spacing: 1px; color: var(--red); font-size: 15px; }
    .time { align-items: flex-end; }
    .time .v { color: var(--cyan); }

    .wave-center {
      min-width: 0;
      display: grid;
      gap: 5px;
      justify-items: center;
    }

    .wave-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 15px;
      font-weight: 1000;
      color: var(--gold);
      line-height: 1;
      white-space: nowrap;
    }

    .tier {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 29px;
      height: 17px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--gold);
      color: #09152c;
      font-size: 10px;
      font-weight: 1000;
    }

    .wavebar {
      width: min(178px, 100%);
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.45);
    }

    .wavebar span {
      display: block;
      width: 72%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), var(--orange), var(--red));
    }

    .surv-sub {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: rgba(255,255,255,.66);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .surv-sub strong { color: var(--gold); }
    .surv-sub .boss { justify-self: center; color: #fff; background: rgba(255,91,116,.22); border: 1px solid rgba(255,91,116,.44); border-radius: 999px; padding: 4px 8px; }
    .surv-sub .next { justify-self: end; color: rgba(255,255,255,.72); }

    .effects {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 25px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(145, 172, 255, .16);
    }

    .effect {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 24px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(141, 167, 255, .25);
      background: rgba(6, 12, 32, .46);
      color: rgba(255,255,255,.82);
      font-size: 11px;
      font-weight: 950;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .effect.gold { color: var(--gold); border-color: rgba(255,216,77,.42); background: rgba(255,216,77,.10); }
    .effect.violet { color: #dac7ff; border-color: rgba(168,121,255,.46); background: rgba(168,121,255,.10); }

    .danger {
      width: calc(100% - 20px);
      justify-self: center;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 7px;
      min-height: 22px;
      padding: 0 4px;
      color: var(--orange);
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .danger .track {
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0,0,0,.48);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
    }

    .danger .track span {
      display: block;
      height: 100%;
      width: 72%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--gold), var(--orange));
    }

    .board-frame {
      position: relative;
      width: calc(100% - 20px);
      justify-self: center;
      aspect-ratio: 1;
      border: 1px solid rgba(255,216,77,.48);
      border-radius: 20px;
      padding: 7px;
      background:
        radial-gradient(circle at 50% 100%, rgba(70, 138, 255, .42), transparent 44%),
        linear-gradient(180deg, rgba(39, 55, 112, .86), rgba(18, 29, 72, .90));
      box-shadow: 0 14px 32px rgba(0,0,0,.46), 0 0 0 1px rgba(25,230,230,.18), inset 0 1px 0 rgba(255,255,255,.10);
      overflow: hidden;
    }

    .board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 5px;
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      border-radius: 10px;
      border: 1px solid rgba(139, 169, 255, .24);
      background: rgba(13, 27, 69, .62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      font-size: 24px;
      font-weight: 1000;
      line-height: 1;
    }

    .cell.filled { background: rgba(91, 124, 210, .38); border-color: rgba(164, 190, 255, .35); }
    .cell.hot { border-color: rgba(255,91,116,.88); box-shadow: 0 0 0 1px rgba(255,91,116,.55), 0 0 14px rgba(255,91,116,.50), inset 0 1px 0 rgba(255,255,255,.08); }
    .cell.ice::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 8px;
      border: 2px solid rgba(159, 224, 255, .72);
      background: linear-gradient(135deg, transparent 44%, rgba(176,230,255,.45) 45% 55%, transparent 56%);
      pointer-events: none;
    }
    .cell.lock::after {
      content: "🔒";
      position: absolute;
      right: 6px;
      top: 5px;
      font-size: 15px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
    }

    .tri { color: #45d676; text-shadow: 0 0 10px rgba(67,229,143,.22); }
    .star { color: #ffd84d; text-shadow: 0 0 10px rgba(255,216,77,.28); }
    .heart { color: #a879ff; text-shadow: 0 0 10px rgba(168,121,255,.24); }
    .square { color: #5694ff; text-shadow: 0 0 10px rgba(86,148,255,.24); }
    .bomb { filter: drop-shadow(0 0 8px rgba(255,91,116,.38)); }

    .toolbelt {
      width: calc(100% - 20px);
      justify-self: center;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: stretch;
      min-height: 84px;
      padding: 8px;
      border: 1px solid rgba(145, 172, 255, .22);
      border-radius: 17px;
      background: linear-gradient(180deg, rgba(18, 31, 72, .76), rgba(6, 11, 32, .84));
      box-shadow: 0 12px 28px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.08);
    }

    .power-widget {
      min-width: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      justify-items: center;
      align-items: center;
      gap: 3px;
      padding: 3px 0 1px;
    }

    .score-row .power-widget {
      justify-self: start;
      width: 64px;
    }

    .ring {
      width: 54px;
      height: 54px;
      position: relative;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle, #13224f 46%, transparent 47%),
        conic-gradient(var(--gold) 0 28%, rgba(255,216,77,.18) 28% 32%, var(--cyan) 32% 78%, rgba(255,255,255,.12) 78% 100%);
      box-shadow: 0 0 18px rgba(25,230,230,.28), inset 0 0 0 6px rgba(5,9,25,.82);
    }

    .ring::before {
      content: "";
      width: 25px;
      height: 25px;
      background: url("../../img/ui/fire.png") center / contain no-repeat;
      filter: drop-shadow(0 0 7px rgba(255,216,77,.44));
    }

    .power-label {
      font-size: 9px;
      font-weight: 1000;
      line-height: 1;
      color: rgba(255,255,255,.70);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .tool {
      position: relative;
      min-width: 0;
      height: 70px;
      display: grid;
      grid-template-rows: 1fr auto;
      justify-items: center;
      align-items: center;
      gap: 3px;
      padding: 10px 4px 5px;
      border: 1px solid rgba(151, 174, 255, .30);
      border-radius: 14px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.12), transparent 30%),
        linear-gradient(180deg, rgba(37, 54, 112, .88), rgba(13, 22, 58, .94));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 18px rgba(0,0,0,.24);
      color: #dbe8ff;
      cursor: pointer;
      font: inherit;
      appearance: none;
    }

    .tool::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.05);
      pointer-events: none;
    }

    .tool.ready {
      border-color: rgba(25,230,230,.54);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 0 18px rgba(25,230,230,.18), 0 8px 18px rgba(0,0,0,.24);
    }

    .tool.earned {
      border-color: rgba(255,216,77,.56);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 18px rgba(255,216,77,.20), 0 8px 18px rgba(0,0,0,.24);
    }

    .tool-icon {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
      color: var(--tool-color, var(--cyan));
    }

    .tool-icon::before {
      content: "";
      width: 21px;
      height: 21px;
      background: currentColor;
      mask: var(--tool-url) center / contain no-repeat;
      -webkit-mask: var(--tool-url) center / contain no-repeat;
      filter: drop-shadow(0 0 6px currentColor);
    }

    .tool-name {
      max-width: 100%;
      color: rgba(255,255,255,.75);
      font-size: 8px;
      font-weight: 950;
      line-height: 1;
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stock {
      position: absolute;
      right: 4px;
      top: 4px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #ff6b74;
      color: #fff;
      border: 2px solid #111936;
      font-size: 10px;
      font-weight: 1000;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .earned-tag {
      position: absolute;
      left: 4px;
      top: 4px;
      height: 15px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff1a8, var(--gold));
      color: #2a1900;
      font-size: 8px;
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 0 10px rgba(255,216,77,.28);
    }

    .tool.earned .stock {
      top: 22px;
      border-color: rgba(255,216,77,.38);
    }

    .tool.hint-tool {
      --tool-color: var(--gold);
      border-color: rgba(255,216,77,.38);
      background:
        radial-gradient(circle at 50% 18%, rgba(255,216,77,.18), transparent 32%),
        linear-gradient(180deg, rgba(48, 57, 115, .90), rgba(16, 24, 62, .94));
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Mockup HUD Supervivencia">
    <div class="stars"></div>
    <section class="game">
      <header class="topbar">
        <div class="coin-stack">
          <button class="pill wallet-pill" aria-label="Comprar monedas"><img src="../../img/ui/coin.png" alt=""> <strong>690 892</strong><span class="plus" aria-hidden="true"></span></button>
          <button class="pill wallet-pill gems" aria-label="Comprar gemas"><img src="../../img/ui/gem.png" alt=""> <strong>1 240</strong><span class="plus" aria-hidden="true"></span></button>

      <section class="event-dock" aria-live="polite">

          <div class="metric time">
            <span class="k">Tiempo</span>
            <span class="v">148s</span>
          </div>
        </div>
        <div class="surv-sub">
          <span>Mejor <strong>52</strong></span>
          <span class="boss">Jefe próximo</span>
          <span class="next">Pool +1</span>
        </div>
        <div class="effects" aria-label="Estados activos">
          <span class="effect gold">📅🔥 semana furia</span>
          <span class="effect violet">📈 +25%</span>

          <div class="ring" aria-hidden="true"></div>

        </div>
        <div class="scorebox">
          <span class="score">1 284 560</span>
          <span class="score-meta"><span class="best-score">Mejor <strong>2 450 000</strong></span><span class="mult">×7.2</span></span>

  </main>

  <script>
    const tiles = [
      ['star','heart','empty','lock square','square','tri','ice','tri'],
      ['empty','square','tri','empty','bomb hot','empty','tri','square'],
      ['heart','empty','tri','empty','square','empty','star','tri'],
      ['empty','tri hot','star hot','empty','empty','tri','empty','star hot'],
      ['empty','empty','empty','empty','empty','empty','empty','empty'],
      ['tri','heart hot','empty','empty','star hot','star hot','square','empty'],
      ['tri','empty','empty','empty','star','empty','empty','tri'],
      ['empty','empty','star','square','square','heart','star','tri']
    ];
    const glyphs = { star: '★', heart: '♥', square: '■', tri: '▲', bomb: '💣', empty: '' };
    const board = document.getElementById('board');
    tiles.flat().forEach((name) => {
      const classes = name.split(' ');
      const kind = classes.find((c) => glyphs[c] !== undefined) || 'empty';
      const cell = document.createElement('div');
      cell.className = 'cell ' + classes.join(' ') + (kind !== 'empty' ? ' filled' : '');
      cell.textContent = glyphs[kind];
      board.appendChild(cell);
    });
  </script>
</body>
