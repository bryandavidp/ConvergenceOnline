          "Haz clic en una celda vacía donde converjan al menos 2 iconos iguales. Observa los iconos resaltados.",
        target: ".cell:empty",
        position: "top",
        action: "highlight-convergence-2",
      },
      {
        title: "Convergencia triple",
        message:
          "Cuando 3 iconos iguales convergen, obtienes más puntos. Observa este ejemplo.",
        target: ".cell:empty",
        position: "top",
        action: "highlight-convergence-3",
      },
      {
        title: "Convergencia cuádruple",
        message:
          "¡4 iconos convergentes te dan la máxima puntuación! Busca estas oportunidades.",
        target: ".cell:empty",
        position: "top",
        action: "highlight-convergence-4",
      },
      {
        title: "Puntuación",
        message:
          "Ganarás puntos por cada icono que elimines. ¡Intenta conseguir la mayor puntuación!",
        target: "#score",
        position: "right",
      },
      {
        title: "¡Listo para jugar!",
        message: "Ahora ya sabes lo básico. ¡Diviértete jugando!",
        target: null,
        position: "center",
      },
    ];

    this.currentStep = 0;
    this.tutorialElement = null;
    this.overlay = null;
    this.completed = localStorage.getItem("tutorialCompleted") === "true";
  }

  start() {
    if (this.completed) return;

    this.createOverlay();
    this.showStep(0);

    // Pausar el juego durante el tutorial
    if (this.game) {
      this.game.pauseGame();
    }
  }

  // Modificar el overlay para permitir interacción con el tablero
  createOverlay() {
    this.overlay = document.createElement("div");
    this.overlay.className = "tutorial-overlay";

    // Hacer que el overlay permita clics en elementos específicos
    this.overlay.style.pointerEvents = "none";

    document.body.appendChild(this.overlay);

    this.tutorialElement = document.createElement("div");
    this.tutorialElement.className = "tutorial-box";
    this.tutorialElement.style.pointerEvents = "auto"; // Asegurar que el cuadro tutorial recibe clics
    document.body.appendChild(this.tutorialElement);
  }

  // Modificar showStep para manejar los diferentes tipos de convergencia
  showStep(index) {
    if (index >= this.steps.length) {
      this.complete();
      return;
    }

    // Limpiar resaltados anteriores
    this.clearAllHighlights();

    const step = this.steps[index];
    this.currentStep = index;

    // Actualizar contenido
    this.tutorialElement.innerHTML = `
      <h3>${step.title}</h3>
      <p>${step.message}</p>
      <div class="tutorial-buttons">
        ${index > 0 ? '<button class="tutorial-prev">Anterior</button>' : ""}
        <button class="tutorial-next">${
          index < this.steps.length - 1 ? "Siguiente" : "Finalizar"
        }</button>
      </div>
    `;

    // Posicionar el tutorial
    if (step.target) {
      let targetElement;

      // Manejar diferentes acciones
      if (step.action && step.action.startsWith("highlight-convergence")) {
        const convergenceCount = parseInt(step.action.split("-")[2]);
        targetElement = this.setupConvergenceExample(convergenceCount);
      } else {
        targetElement = document.querySelector(step.target);
      }

      if (targetElement) {
        this.positionTutorial(targetElement, step.position);
        this.highlightElement(targetElement);
      }
    } else {
      // Centrar en la pantalla
      this.tutorialElement.style.top = "50%";
      this.tutorialElement.style.left = "50%";
      this.tutorialElement.style.transform = "translate(-50%, -50%)";
    }

    // Añadir event listeners
    const nextButton = this.tutorialElement.querySelector(".tutorial-next");
    if (nextButton) {
      nextButton.addEventListener("click", () => this.showStep(index + 1));
    }

    const prevButton = this.tutorialElement.querySelector(".tutorial-prev");
    if (prevButton) {
      prevButton.addEventListener("click", () => this.showStep(index - 1));
    }
  }

  // Método para limpiar todos los resaltados
  clearAllHighlights() {
    const highlighted = document.querySelectorAll(
      ".tutorial-highlight, .tutorial-highlight-pulse, .tutorial-convergent-icon"
    );
    highlighted.forEach((el) => {
      el.classList.remove(
        "tutorial-highlight",
        "tutorial-highlight-pulse",
        "tutorial-convergent-icon"
      );
    });
  }

  // Método para configurar ejemplos específicos de convergencia
  setupConvergenceExample(count) {
    const board = this.game.board;

    // Guardar el estado actual del tablero si aún no se ha hecho
    if (!this.savedBoardState) {
      this.savedBoardState = JSON.parse(JSON.stringify(board.grid));
      this.boardWasModified = true;
    }

    // Crear una configuración específica para el tutorial
    const centerRow = Math.floor(board.size / 2);
    const centerCol = Math.floor(board.size / 2);

    // Asegurarse de que la celda central está vacía
    board.grid[centerRow][centerCol] = null;

    // Seleccionar un icono para el ejemplo
    const demoIcon = board.icons[0]; // Usar el primer icono disponible

    // Definir posiciones según el tipo de convergencia
    let positions = [];

    if (count === 2) {
      // Convergencia doble: arriba y abajo
      positions = [
        [centerRow - 1, centerCol], // Arriba
        [centerRow + 1, centerCol], // Abajo
      ];
    } else if (count === 3) {
      // Convergencia triple: arriba, abajo e izquierda
      positions = [
        [centerRow - 1, centerCol], // Arriba
        [centerRow + 1, centerCol], // Abajo
        [centerRow, centerCol - 1], // Izquierda
      ];
    } else if (count === 4) {
      // Convergencia cuádruple: las cuatro direcciones
      positions = [
        [centerRow - 1, centerCol], // Arriba
        [centerRow + 1, centerCol], // Abajo
        [centerRow, centerCol - 1], // Izquierda
        [centerRow, centerCol + 1], // Derecha
      ];
    }

    // Limpiar el área alrededor del centro
    for (let r = centerRow - 2; r <= centerRow + 2; r++) {
      for (let c = centerCol - 2; c <= centerCol + 2; c++) {
        if (r >= 0 && r < board.size && c >= 0 && c < board.size) {
          board.grid[r][c] = null;
        }
      }
    }

    // Colocar los iconos en las posiciones definidas
    positions.forEach(([row, col]) => {
      if (row >= 0 && row < board.size && col >= 0 && col < board.size) {
        board.grid[row][col] = demoIcon;
      }
    });

    // Actualizar la visualización
    board.updateVisual();

    // Resaltar la celda central
    const targetCell = board.getCellElement(centerRow, centerCol);
    if (targetCell) {
      targetCell.classList.add("tutorial-highlight-pulse");
    }

    // Resaltar los iconos convergentes
    positions.forEach(([row, col]) => {
      if (row >= 0 && row < board.size && col >= 0 && col < board.size) {
        const iconCell = board.getCellElement(row, col);
        if (iconCell) {
          iconCell.classList.add("tutorial-convergent-icon");
        }
      }
    });

    return targetCell;
  }

  positionTutorial(element, position) {
    const rect = element.getBoundingClientRect();

    switch (position) {
      case "top":
        this.tutorialElement.style.top = `${
          rect.top - this.tutorialElement.offsetHeight - 10
        }px`;
        this.tutorialElement.style.left = `${
          rect.left + rect.width / 2 - this.tutorialElement.offsetWidth / 2
        }px`;
        break;
      case "bottom":
        this.tutorialElement.style.top = `${rect.bottom + 10}px`;
        this.tutorialElement.style.left = `${
          rect.left + rect.width / 2 - this.tutorialElement.offsetWidth / 2
        }px`;
        break;
      case "left":
        this.tutorialElement.style.top = `${
          rect.top + rect.height / 2 - this.tutorialElement.offsetHeight / 2
        }px`;
        this.tutorialElement.style.left = `${
          rect.left - this.tutorialElement.offsetWidth - 10
        }px`;
        break;
      case "right":
        this.tutorialElement.style.top = `${
          rect.top + rect.height / 2 - this.tutorialElement.offsetHeight / 2
        }px`;
        this.tutorialElement.style.left = `${rect.right + 10}px`;
        break;
    }
  }

  highlightElement(element) {
    // Quitar resaltados anteriores
    const highlighted = document.querySelectorAll(".tutorial-highlight");
    highlighted.forEach((el) => el.classList.remove("tutorial-highlight"));

    // Resaltar el elemento actual
    element.classList.add("tutorial-highlight");
  }

  // Modificar en tutorial.js
  highlightEmptyCells() {
    // Si no tenemos acceso al juego o al tablero, no podemos continuar
    if (!this.game || !this.game.board) {
      console.error("No hay acceso al tablero del juego");
      return;
    }

    const board = this.game.board;
    let foundValidCell = false;

    // Recorrer el tablero buscando celdas vacías con iconos convergentes
    for (let row = 0; row < board.size; row++) {
      for (let col = 0; col < board.size; col++) {
        // Verificar si la celda está vacía
        if (!board.grid[row][col]) {
          // Verificar si hay iconos convergentes para esta celda
          const convergingIcons = board.findConvergingIcons(row, col);
          if (convergingIcons && convergingIcons.length > 0) {
            // Encontramos una celda válida, resaltarla
            const cell = board.getCellElement(row, col);
            if (cell) {
              cell.classList.add("tutorial-highlight-pulse");

              // También resaltar los iconos que convergen hacia esta celda
              convergingIcons.forEach(({ row: iconRow, col: iconCol }) => {
                const iconCell = board.getCellElement(iconRow, iconCol);
                if (iconCell) {
                  iconCell.classList.add("tutorial-convergent-icon");
                }
              });

              foundValidCell = true;
              break; // Solo necesitamos una celda para el tutorial
            }
          }
        }
      }
      if (foundValidCell) break;
    }

    // Si no hay celdas válidas, preparar un ejemplo específico para el tutorial
    if (!foundValidCell) {
      this.prepareTutorialBoard();
    }
  }

  // Añadir método para crear un ejemplo específico para el tutorial
  prepareTutorialBoard() {
    const board = this.game.board;

    // Guardar el estado actual del tablero para restaurarlo después
    this.savedBoardState = JSON.parse(JSON.stringify(board.grid));

    // Crear una configuración específica para el tutorial
    // Limpiar una porción del tablero
    const centerRow = Math.floor(board.size / 2);
    const centerCol = Math.floor(board.size / 2);

    // Asegurarse de que la celda central está vacía
    board.grid[centerRow][centerCol] = null;

    // Colocar 4 iconos iguales alrededor de la celda central
    const demoIcon = board.icons[0]; // Usar el primer icono disponible

    // Colocar iconos en las direcciones cardinales (si están dentro del tablero)
    const positions = [
      [centerRow - 1, centerCol], // Arriba
      [centerRow + 1, centerCol], // Abajo
      [centerRow, centerCol - 1], // Izquierda
      [centerRow, centerCol + 1], // Derecha
    ];

    positions.forEach(([row, col]) => {
      // Verificar que la posición esté dentro del tablero
      if (row >= 0 && row < board.size && col >= 0 && col < board.size) {
        board.grid[row][col] = demoIcon;
      }
    });

    // Actualizar la visualización
    board.updateVisual();

    // Resaltar la celda central
    const targetCell = board.getCellElement(centerRow, centerCol);
    if (targetCell) {
      targetCell.classList.add("tutorial-highlight-pulse");
    }

    // Resaltar los iconos convergentes
    positions.forEach(([row, col]) => {
      if (row >= 0 && row < board.size && col >= 0 && col < board.size) {
        const iconCell = board.getCellElement(row, col);
        if (iconCell) {
          iconCell.classList.add("tutorial-convergent-icon");
        }
      }
    });
  }

  // Añadir en la clase TutorialManager

  // Asegurarse de que hay al menos un conjunto de iconos convergentes
  ensureConvergingIconsExist() {
    const board = this.game.board;
    let hasConvergingIcons = false;

    // Verificar si hay alguna celda con iconos convergentes
    for (let row = 0; row < board.size; row++) {
      for (let col = 0; col < board.size; col++) {
        if (!board.grid[row][col]) {
          const convergingIcons = board.findConvergingIcons(row, col);
          if (convergingIcons && convergingIcons.length > 0) {
            hasConvergingIcons = true;
            break;
          }
        }
      }
      if (hasConvergingIcons) break;
    }

    // Si no hay iconos convergentes, crear algunos
    if (!hasConvergingIcons) {
      this.prepareTutorialBoard();
      return true;
    }

    return false;
  }

  // Modificar el método start para preparar el tablero antes del tutorial
  start() {
    if (this.completed) return;

    // Guardar el estado del juego correctamente
    this.gameWasPaused = gameStateManager.isInState(GameStates.PAUSED);

    // Asegurarse de que hay ejemplos para el tutorial
    this.boardWasModified = this.ensureConvergingIconsExist();

    this.createOverlay();
    this.showStep(0);

    // Pausar el juego durante el tutorial
    if (this.game) {
      this.game.pauseGame();
    }
  }

  // Y modificar complete para restaurar estado adecuadamente
  complete() {
    if (this.overlay) {
      this.overlay.remove();
    }

    if (this.tutorialElement) {
      this.tutorialElement.remove();
    }

    // Marcar como completado
    this.completed = true;
    localStorage.setItem("tutorialCompleted", "true");

    // Restaurar el estado original del tablero si se modificó
    if (
      this.boardWasModified &&
      this.savedBoardState &&
      this.game &&
      this.game.board
    ) {
      this.game.board.grid = this.savedBoardState;
      this.game.board.updateVisual();
      this.savedBoardState = null;
    }

    // Limpiar resaltados
    const highlighted = document.querySelectorAll(
      ".tutorial-highlight, .tutorial-highlight-pulse, .tutorial-convergent-icon"
    );
    highlighted.forEach((el) => {
      el.classList.remove(
        "tutorial-highlight",
        "tutorial-highlight-pulse",
        "tutorial-convergent-icon"
      );
    });

    // Reanudar el juego solo si no estaba pausado antes
    if (this.game && !this.gameWasPaused) {
      this.game.resumeGame();
    }
  }

  reset() {
    this.completed = false;
    localStorage.removeItem("tutorialCompleted");
  }
}


// ui.js
import * as config from './config.js';
import { AnimationManager } from './animations.js';
import { eventManager } from './eventManager.js';
import { gameStateManager, GameStates } from './gameState.js';

import { audioManager } from './audioManager.js';


export class UI {
  constructor(game) {
    this.game = game;

    // Elementos principales del DOM
    this.boardElement = document.getElementById('board');
    this.scoreElement = document.getElementById('score');
    this.levelElement = document.getElementById('level');
    this.timerElement = document.getElementById('timer');
    this.speedElement = document.getElementById('speed');

    // Elementos de modales
    this.levelCompleteElement = document.getElementById('level-complete');
    this.levelTimeElement = document.getElementById('level-time');
    this.gameOverElement = document.getElementById('game-over');
    this.finalScoreElement = document.getElementById('final-score');

    // Elementos de nivel
    this.levelNumberDisplay = document.getElementById('level-number-display');
    this.bigLevelNumber = document.getElementById('big-level-number');

    // Elementos de alerta
    this.speedAlert = document.getElementById('speed-alert');
    this.speedAlertValue = document.getElementById('speed-alert-value');

    // Botones
    this.newGameButton = document.getElementById('new-game');
    this.hintButton = document.getElementById('hint');
    this.nextLevelButton = document.getElementById('next-level');
    this.restartButton = document.getElementById('restart');

    // Añadir referencia al botón de pausa
    this.pauseButton = document.getElementById('pause-button');

    this.toggleSoundButton = document.getElementById('toggle-sound');
    this.toggleMusicButton = document.getElementById('toggle-music');

    // Inicializar event listeners
    this.initEventListeners();
  }

  // Inicializar los event listeners para los botones
  // Modificar en ui.js (método initEventListeners)
  initEventListeners() {

    if (this.newGameButton) {
      eventManager.on(this.newGameButton, 'click', () => this.game.restart());
    }

    if (this.hintButton) {
      eventManager.on(this.hintButton, 'click', () => this.game.showHint());
    }

    if (this.nextLevelButton) {
      eventManager.on(this.nextLevelButton, 'click', () => this.game.nextLevel());
    }

    if (this.restartButton) {
      eventManager.on(this.restartButton, 'click', () => this.game.restart());
    }

    if (this.pauseButton) {
      this.pauseButton.addEventListener('click', () => {
        if (gameStateManager.isInState(GameStates.PLAYING)) {
          this.game.pauseGame();
          this.pauseButton.textContent = "▶️ Reanudar";
        } else if (gameStateManager.isInState(GameStates.PAUSED)) {
          this.game.resumeGame();
          this.pauseButton.textContent = "⏸️ Pausa";
        }
      });
    }

    if (this.toggleSoundButton) {
      eventManager.on(this.toggleSoundButton, 'click', () => {
        audioManager.toggleSound(); this.updateSoundIcon();
      });
    }

    if (this.toggleMusicButton) {
      eventManager.on(this.toggleMusicButton, 'click', () => {
        audioManager.toggleMusic(); this.updateMusicIcon();
      });
    }

  }



  updateSoundIcon() {
    this.toggleSoundButton.textContent = audioManager.enabled ? '🔊' : '🔇';
  }

  updateMusicIcon() {
    this.toggleMusicButton.textContent = audioManager.musicEnabled ? '🎵' : '🎵🚫';
  }




  // Actualizar toda la interfaz de usuario
  updateUI() {
    this.updateScore();
    this.updateLevel();
    this.updateTimer();
    this.updateSpeed();
    this.updateBoard();

    // Actualizar visibilidad de elementos según el estado
    const currentState = gameStateManager.getState();

    // Mostrar/ocultar botones según el estado
    if (this.pauseButton) {
      this.pauseButton.style.display =
        gameStateManager.isInState(GameStates.PLAYING, GameStates.PAUSED)
          ? 'block'
          : 'none';
    }

    if (this.hintButton) {
      this.hintButton.style.display =
        gameStateManager.isInState(GameStates.PLAYING)
          ? 'block'
          : 'none';
    }
  }

  // Actualizar la puntuación
  updateScore() {
    if (this.scoreElement) {
      this.scoreElement.textContent = this.game.score;
    }
  }

  // Actualizar el nivel
  updateLevel() {
    if (this.levelElement) {
      this.levelElement.textContent = this.game.level;
    }
  }

  // Actualizar el temporizador
  updateTimer() {
    if (this.timerElement) {
      this.timerElement.textContent = this.game.timer;
    }
  }

  // Actualizar el indicador de velocidad
  updateSpeed() {
    if (this.speedElement) {
      const baseSpeed = 3000;
      const currentSpeed = this.game.spawnRate;
      const speedRatio = (baseSpeed / currentSpeed).toFixed(1);
      this.speedElement.textContent = `${speedRatio}x`;
    }
  }

  // Actualizar el tablero visual
  updateBoard() {
    if (!this.boardElement) return;

    const cells = this.boardElement.querySelectorAll('.cell');
    cells.forEach((cell) => {
      const row = parseInt(cell.dataset.row);
      const col = parseInt(cell.dataset.col);
      cell.textContent = this.game.board.grid[row][col] || '';
    });
  }

  // Crear celdas del tablero
  createBoardCells(size, handleCellClick) {
    if (!this.boardElement) return;

    this.boardElement.innerHTML = '';
    this.boardElement.style.gridTemplateColumns = `repeat(${size}, var(--cell-size))`;
    this.boardElement.style.gridTemplateRows = `repeat(${size}, var(--cell-size))`;

    for (let row = 0; row < size; row++) {
      for (let col = 0; col < size; col++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
        cell.dataset.row = row;
        cell.dataset.col = col;

        // Añadir event listener para el clic
        cell.addEventListener('click', () => handleCellClick(row, col));

        this.boardElement.appendChild(cell);
      }
    }
  }

  // Limpiar destacados en el tablero
  clearHighlights() {
    if (!this.boardElement) return;

    const cells = this.boardElement.querySelectorAll('.cell');
    cells.forEach((cell) => {
      cell.classList.remove('highlight', 'path', 'error');
    });
  }

  // Destacar celdas
  highlightCells(cells, className) {
    cells.forEach(({ row, col }) => {
      this.highlightCell(row, col, className);
    });
  }

  // Destacar una celda individual
  highlightCell(row, col, className) {
    const cell = this.boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);

    this.levelCompleteElement.style.display = 'flex';
    this.levelCompleteElement.classList.add('fade-in');

  // Ocultar pantalla de nivel completado
  hideLevelComplete(callback) {
    if (!this.levelCompleteElement) {
      if (callback) callback();
      return;
    }

    this.levelCompleteElement.classList.add('fade-out');

      this.levelCompleteElement.style.display = 'none';

    if (!this.levelNumberDisplay || !this.bigLevelNumber) {
      if (callback) callback();
      return;
    }

    this.bigLevelNumber.textContent = level;

    this.levelNumberDisplay.classList.add('level-number-animation');
    const levelContent = this.levelNumberDisplay.querySelector('.level-number-content');
    if (levelContent) {
      levelContent.classList.add('level-number-content-animation');
    }

    setTimeout(() => {
      this.levelNumberDisplay.classList.remove('level-number-animation');
      if (levelContent) {
        levelContent.classList.remove('level-number-content-animation');
      }

      if (callback) callback();
    }, 2500);

  // Mostrar pantalla de fin de juego
  showGameOver() {
    if (!this.gameOverElement || !this.finalScoreElement) return;

    this.finalScoreElement.textContent = this.game.score;
    this.gameOverElement.style.display = 'flex';
    this.gameOverElement.classList.add('fade-in');

  // Mostrar alerta de aumento de velocidad
  showSpeedAlert(speedMultiplier) {
    if (!this.speedAlert || !this.speedAlertValue) return;

    // Actualizar el valor de velocidad
    this.speedAlertValue.textContent = `${speedMultiplier}x`;

    // Mostrar y animar la alerta

  // Mostrar alerta de penalización
  showPenaltyAlert() {
    // Crear elemento de alerta si no existe
    let penaltyAlert = document.getElementById('penalty-alert');

    if (!penaltyAlert) {
      penaltyAlert = document.createElement('div');
      penaltyAlert.id = 'penalty-alert';
      penaltyAlert.className = 'penalty-alert';

      const alertContent = document.createElement('div');
      alertContent.className = 'penalty-alert-content';

      const icon = document.createElement('div');
      icon.className = 'penalty-icon';
      icon.textContent = '⚠️';

      const text = document.createElement('div');
      text.className = 'penalty-text';
      text.textContent = '¡Penalización! Velocidad aumentada';

      alertContent.appendChild(icon);
      alertContent.appendChild(text);
      penaltyAlert.appendChild(alertContent);

      document.body.appendChild(penaltyAlert);
    }

    // Mostrar y animar la alerta
    penaltyAlert.style.animation = 'none';
    void penaltyAlert.offsetWidth; // Forzar reflow
    penaltyAlert.style.animation = 'penaltyAlertAnim 2s ease-in-out forwards';
  }

  // Animar puntos ganados
  animatePointsEarned(targetCell, points) {
    if (!targetCell) return;

    const pointsDisplay = document.createElement('div');
    pointsDisplay.textContent = `+${points}`;
    pointsDisplay.style.position = 'absolute';
    pointsDisplay.style.top = `${targetCell.offsetTop}px`;
    pointsDisplay.style.left = `${targetCell.offsetLeft}px`;
    pointsDisplay.style.color = '#4caf50';
    pointsDisplay.style.fontWeight = 'bold';
    pointsDisplay.style.fontSize = '1.5rem';
    pointsDisplay.style.zIndex = '100';
    pointsDisplay.style.pointerEvents = 'none';
    document.body.appendChild(pointsDisplay);

    pointsDisplay.animate(
      [
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(-50px)', opacity: 0 }
      ],
      {

        easing: 'ease-out'

      document.body.removeChild(pointsDisplay);

    const cell = this.boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
    if (!cell) return;

    cell.classList.add('shake-effect');

    // Quitar la clase de error después de un tiempo

      cell.classList.remove('shake-effect');

  // Animar tablero (shake)
  animateBoard() {
    if (!this.boardElement) return;

    this.boardElement.classList.add('board-shake');
    setTimeout(() => {
      this.boardElement.classList.remove('board-shake');
    }, 500);
  }

  // Mostrar pista
  showHint(targetRow, targetCol, convergingIcons) {
    if (!this.boardElement) return;

    this.clearHighlights();

    const targetCell = this.boardElement.querySelector(`[data-row="${targetRow}"][data-col="${targetCol}"]`);
    if (!targetCell) return;

    targetCell.classList.add('highlight', 'hint-effect');

    // Animar los iconos convergentes
    convergingIcons.forEach(({ row, col }) => {
      const cell = this.boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
      if (cell) {
        cell.classList.add('path', 'pulse-effect');
      }
    });

    // Quitar las animaciones después de un tiempo
    setTimeout(() => {
      targetCell.classList.remove('hint-effect');
      convergingIcons.forEach(({ row, col }) => {
        const cell = this.boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        if (cell) {
          cell.classList.remove('pulse-effect');
        }
      });
    }, config.ANIMATION_DURATIONS.hint);
  }

  setCellSize(boardSize) {
    const cellSize = config.CSS_VARIABLES.cellSizeFormula(boardSize);

  // utils.js

/**
 * Verifica si una celda está dentro de los límites del tablero
 * @param {number} row - Fila de la celda
 * @param {number} col - Columna de la celda
 * @param {number} boardSize - Tamaño del tablero
 * @returns {boolean} - Verdadero si la celda es válida
 */
export function isValidCell(row, col, boardSize) {
  return row >= 0 && row < boardSize && col >= 0 && col < boardSize;
}

/**
 * Obtiene un elemento aleatorio de un array
 * @param {Array} array - Array del que obtener un elemento
 * @returns {*} - Elemento aleatorio del array
 */
export function getRandomElement(array) {
  return array[Math.floor(Math.random() * array.length)];
}

/**
 * Genera un número aleatorio entre min y max (inclusive)
 * @param {number} min - Valor mínimo
 * @param {number} max - Valor máximo
 * @returns {number} - Número aleatorio
 */
export function getRandomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/**
 * Mezcla un array (algoritmo Fisher-Yates)
 * @param {Array} array - Array a mezclar
 * @returns {Array} - Array mezclado
 */
export function shuffleArray(array) {
  const newArray = [...array];
  for (let i = newArray.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
  }
  return newArray;
}

/**
 * Formatea el tiempo en segundos a formato mm:ss
 * @param {number} seconds - Tiempo en segundos
 * @returns {string} - Tiempo formateado
 */
export function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = seconds % 60;
  return `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
}

/**
 * Crea un elemento DOM con atributos y clases
 * @param {string} tag - Etiqueta HTML
 * @param {Object} attributes - Atributos del elemento
 * @param {string|string[]} classes - Clases CSS
 * @param {string} textContent - Contenido de texto
 * @returns {HTMLElement} - Elemento creado
 */
export function createElement(tag, attributes = {}, classes = [], textContent = '') {
  const element = document.createElement(tag);

  // Añadir atributos
  Object.entries(attributes).forEach(([key, value]) => {
    element.setAttribute(key, value);
  });

  // Añadir clases
  if (Array.isArray(classes)) {
    classes.forEach(cls => element.classList.add(cls));
  } else if (classes) {
    element.classList.add(classes);
  }

  // Añadir contenido de texto
  if (textContent) {
    element.textContent = textContent;
  }

  return element;
}

/**
 * Guarda datos en localStorage
 * @param {string} key - Clave para almacenar
 * @param {*} value - Valor a almacenar
 */
export function saveToLocalStorage(key, value) {
  try {
    const serializedValue = JSON.stringify(value);
    localStorage.setItem(key, serializedValue);
  } catch (error) {
    console.error('Error al guardar en localStorage:', error);
  }
}

/**
 * Carga datos desde localStorage
 * @param {string} key - Clave a cargar
 * @param {*} defaultValue - Valor por defecto si no existe
 * @returns {*} - Valor cargado o valor por defecto
 */
export function loadFromLocalStorage(key, defaultValue = null) {
  try {
    const serializedValue = localStorage.getItem(key);
    if (serializedValue === null) {
      return defaultValue;
    }
    return JSON.parse(serializedValue);
  } catch (error) {
    console.error('Error al cargar desde localStorage:', error);
    return defaultValue;
  }
}

/**
 * Detecta si el dispositivo es móvil
 * @returns {boolean} - Verdadero si es un dispositivo móvil
 */
export function isMobileDevice() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

/**
 * Previene el comportamiento de zoom en dispositivos móviles
 */
export function preventZoom() {
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('wheel', function (e) {
    if (e.ctrlKey) {
      e.preventDefault();
    }
  }, { passive: false });
}

/**
 * Ajusta la altura de la ventana para dispositivos móviles
 */
export function setViewportHeight() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}

/**
 * Debounce: limita la frecuencia de ejecución de una función
 * @param {Function} func - Función a ejecutar
 * @param {number} wait - Tiempo de espera en ms
 * @returns {Function} - Función con debounce
 */
export function debounce(func, wait) {
  let timeout;
  return function (...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}



/**
* Optimiza las operaciones de DOM en lote
* @param {Function} updateFunction - Función que realiza actualizaciones del DOM
*/
export function batchDOMUpdates(updateFunction) {
  // Usar requestAnimationFrame para sincronizar con el ciclo de renderizado
  requestAnimationFrame(() => {
    // Crear DocumentFragment para agrupar cambios del DOM
    const fragment = document.createDocumentFragment();

    // Ejecutar la función de actualización con el fragmento
    updateFunction(fragment);
  });
}

/**
 * Crea un sistema de pooling para reutilizar elementos DOM
 * @param {string} elementType - Tipo de elemento HTML a crear
 * @param {number} initialSize - Tamaño inicial del pool
 * @returns {Object} - API del pool de elementos
 */
export function createElementPool(elementType, initialSize = 20) {
  const pool = [];

  // Crear elementos iniciales
  for (let i = 0; i < initialSize; i++) {
    const element = document.createElement(elementType);
    element.style.display = 'none';
    pool.push(element);
    document.body.appendChild(element);
  }

  return {
    // Obtener un elemento del pool
    get: () => {
      if (pool.length > 0) {
        const element = pool.pop();
        element.style.display = '';
        return element;
      } else {
        // Crear nuevo elemento si el pool está vacío
        const element = document.createElement(elementType);
        document.body.appendChild(element);
        return element;
      }
    },
    // Devolver un elemento al pool
    release: (element) => {
      element.style.display = 'none';
      // Limpiar propiedades
      element.className = '';
      element.textContent = '';
      // Resetear estilos inline
      element.removeAttribute('style');
      element.style.display = 'none';
      pool.push(element);
    }
  };
}







/**
 * Valida un objeto contra un esquema de validación
 * @param {Object} data - Datos a validar
 * @param {Object} schema - Esquema de validación
 * @returns {Object} - Resultado de validación {valid: boolean, errors: string[]}
 */
export function validateObject(data, schema) {
  const errors = [];
  const result = {
    valid: true,
    errors: []
  };
  
  for (const [key, validationRules] of Object.entries(schema)) {
    // Comprobar si el campo es requerido
    if (validationRules.required && (data[key] === undefined || data[key] === null)) {
      errors.push(`El campo '${key}' es requerido`);
      result.valid = false;
      continue;
    }
    
    // Si el campo no existe pero no es requerido, omitir otras validaciones
    if (data[key] === undefined || data[key] === null) {
      continue;
    }
    
    // Validar tipo
    if (validationRules.type && typeof data[key] !== validationRules.type) {
      errors.push(`El campo '${key}' debe ser de tipo ${validationRules.type}`);
      result.valid = false;
    }
    
    // Validar máximo/mínimo para números
    if (validationRules.type === 'number') {
      if (validationRules.min !== undefined && data[key] < validationRules.min) {
        errors.push(`El campo '${key}' debe ser mayor o igual a ${validationRules.min}`);
        result.valid = false;
      }
      if (validationRules.max !== undefined && data[key] > validationRules.max) {
        errors.push(`El campo '${key}' debe ser menor o igual a ${validationRules.max}`);
        result.valid = false;
      }
    }
    
    // Validar longitud para strings
    if (validationRules.type === 'string') {
      if (validationRules.minLength !== undefined && data[key].length < validationRules.minLength) {
        errors.push(`El campo '${key}' debe tener al menos ${validationRules.minLength} caracteres`);
        result.valid = false;
      }
      if (validationRules.maxLength !== undefined && data[key].length > validationRules.maxLength) {
        errors.push(`El campo '${key}' debe tener como máximo ${validationRules.maxLength} caracteres`);
        result.valid = false;
      }
    }
    
    // Validar regex
    if (validationRules.pattern && !validationRules.pattern.test(data[key])) {
      errors.push(`El campo '${key}' no cumple con el formato requerido`);
      result.valid = false;
    }
    
    // Validar lista de valores permitidos
    if (validationRules.enum && !validationRules.enum.includes(data[key])) {
      errors.push(`El campo '${key}' debe ser uno de los siguientes valores: ${validationRules.enum.join(', ')}`);
      result.valid = false;
    }
    
    // Validación personalizada
    if (validationRules.custom && typeof validationRules.custom === 'function') {
      const customResult = validationRules.custom(data[key], data);
      if (customResult !== true) {
        errors.push(customResult || `El campo '${key}' no cumple con la validación personalizada`);
        result.valid = false;
      }
    }
  }
  
  result.errors = errors;
  return result;
}
