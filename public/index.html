<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1e2133" />
    <meta
      name="description"
      content="Convergence Online - Un juego de coincidencias y estrategia"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Convergence Online</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overscroll-behavior: none;
      }
      
      body.in-game-page {
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      
      /* Prevenir doble-tap to zoom en iOS */
      body.in-game-page * {
        touch-action: manipulation;
      }
      
      #root {
        height: 100%;
      }
      
      /* Estilos para el mensaje de error */
      .error-boundary {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #a2d8ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        color: #333;
        z-index: 9999;
        padding: 20px;
        text-align: center;
        border: 8px solid white;
        box-sizing: border-box;
      }
      
      .error-boundary h1 {
        font-size: 2rem;
        margin-bottom: 10px;
        color: #ff6b81;
      }
      
      .error-boundary p {
        margin-bottom: 20px;
        font-size: 1rem;
        max-width: 500px;
      }
      
      .error-boundary button {
        background-color: #5ad95a;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: bold;
        border-radius: 24px;
        cursor: pointer;
        box-shadow: 0 4px 0 #3a9b3a;
        border: 3px solid white;
        transition: all 0.2s ease;
      }
      
      .error-boundary button:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 0 #3a9b3a;
      }
      
      .error-boundary button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #3a9b3a;
      }
      
      /* Spinner de carga */
      .loading-spinner {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #151b35;
        z-index: 999;
      }
      
      .spinner {
        width: 60px;
        height: 60px;
        border: 6px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        border-top-color: #ff3366;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta aplicación.</noscript>
    <div id="root">
      <!-- Spinner de carga mientras la aplicación se inicia -->
      <div class="loading-spinner">
        <div class="spinner"></div>
      </div>
    </div>
    
    <!-- Script para manejar errores de carga -->
    <script>
      window.addEventListener('error', function(e) {
        // Solo manejar errores críticos que impiden la carga
        if (e.error && e.error.message && e.error.message.includes('Provider')) {
          const rootElement = document.getElementById('root');
          if (rootElement) {
            rootElement.innerHTML = `
              <div class="error-boundary">
                <h1>Algo salió mal</h1>
                <p>Ha ocurrido un error en la aplicación. Por favor recarga la página.</p>
                <button onclick="window.location.reload()">Recargar</button>
              </div>
            `;
          }
        }
      }, true);
    </script>
  </body>
</html>
