name: Deploy to GitHub Pages

# Despliega la app estática (100% vanilla, sin build) a GitHub Pages en cada push a la
# rama por defecto. Requiere, una única vez, activar Pages en Settings → Pages → Source:
# "GitHub Actions". A partir de ahí, cada merge a clon-vanilla queda publicado.
on:
  push:
    branches: ['clon-vanilla']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelar uno en curso a mitad de publicación.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Subir el sitio (raíz del repo: index.html + assets)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
